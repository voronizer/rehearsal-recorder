<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>РЭХА: multitrack recording for band rehearsals</title>
    <meta
      name="description"
      content="A free app for macOS and Windows that records a band's rehearsal, one track per musician, and keeps every rehearsal you record."
    />
    <link rel="canonical" href="https://reha.stream/" />
    <!-- The card a chat draws for a link to the site. The picture is drawn
         from og.html in CI (scripts/og.mjs); chats want addresses whole. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="РЭХА" />
    <meta property="og:url" content="https://reha.stream/" />
    <meta property="og:title" content="РЭХА: multitrack recording for band rehearsals" />
    <meta
      property="og:description"
      content="A free app for macOS and Windows that records a band's rehearsal, one track per musician, and keeps every rehearsal you record."
    />
    <meta property="og:image" content="https://reha.stream/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="РЭХА: the rehearsal screen, playing a take" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google's results show no SVG icon, so the same icon as a PNG too;
         packaging/make_icons.py draws it, and /favicon.ico. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/page/main.tsx"></script>
  </body>
</html>
