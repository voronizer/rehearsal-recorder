<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- For the link picture (scripts/og.mjs), on the site's CI runner: the app
     draws in the computer's own font (-apple-system, Segoe UI), which a
     Linux runner has neither of. This gives it Inter, which is close to the
     Mac's, as the picture was chosen with; "РЭХА" is in Inter too, since
     the page's font has no Cyrillic. site.yml installs it as
     /etc/fonts/conf.d/56-og-fonts.conf: after 49-sansserif.conf and before
     60-latin.conf, the first that prefer another font for sans-serif. -->
<fontconfig>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
