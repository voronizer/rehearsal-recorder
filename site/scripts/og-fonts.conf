<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- For the link picture (scripts/og.mjs), on the site's CI runner: the app
     and the picture's words other than its heading are in the computer's
     own font (-apple-system, Segoe UI), which a Linux runner has neither
     of. This gives them Inter, which is close to the Mac's, as the picture
     was chosen with. The heading is in Geologica, from the site. The site's
     CI step
     (.github/actions/site) installs it as /etc/fonts/conf.d/56-og-fonts.conf:
     after 49-sansserif.conf and before 60-latin.conf, the first that prefer
     another font for sans-serif. -->
<fontconfig>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
