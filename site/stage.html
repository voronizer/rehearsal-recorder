<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>РЭХА</title>
    <!-- Only ever shown inside the site's page. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The app in a frame of the site, in the system's theme as the site
      // round it, from the first paint: a dark page never shows a white box
      // while the frame's own script loads. The rest is what the app's own
      // index.html reads.
      try {
        localStorage.setItem("rr-theme", "system")
        localStorage.setItem("rr-scale", "1")
      } catch (e) {}
      document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.style.fontSize = "16px"
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/stage/main.tsx"></script>
  </body>
</html>
