<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Dark when the system is, set before the page is drawn so a dark
         computer never sees it white, and kept with the system's setting
         while the page is open. The class is the app's own (ui/src/index.css). -->
    <script>
      ;(() => {
        const dark = matchMedia("(prefers-color-scheme: dark)")
        const set = () => document.documentElement.classList.toggle("dark", dark.matches)
        set()
        dark.addEventListener("change", set)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>РЭХА: nothing was recorded here</title>
    <!-- What Vercel answers, with status 404, for an address that is no file
         of the site (see vercel-config.json). -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/notfound/main.tsx"></script>
  </body>
</html>
