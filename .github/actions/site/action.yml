# The website, reha.stream (site/ in this repository), built and tested,
# and laid out as the files that go up to Cloudflare, left as the artifact
# `site`. A pull request's check (checks.yml) and a release (release.yml)
# both build it here; only the release's deploy job and a pull request's
# preview put it on Cloudflare. The job checks out first, and uploads the
# Playwright report itself if a step fails.
#
# The picture a chat shows for a link to the site, og.png, is drawn here
# from the build (npm run og, after the build and before the tests), so it
# shows the app as the build has it.
#
# The job runs in Playwright's own image (mcr.microsoft.com/playwright),
# which has the browser and everything it needs, as an ordinary user: so
# nothing here installs a browser, and nothing uses apt. The job's
# container line says which image; see `which release` in release.yml and
# `what changed` in checks.yml.

name: The site, built and tested
description: Builds and tests reha.stream, draws its link picture and lays the build out for Cloudflare.

inputs:
  version:
    description: The release's tag; empty in a pull request, where the build takes the newest version in CHANGELOG.md
    required: false
    default: ""
  analytics-token:
    description: The site's token in Cloudflare Web Analytics (the repository's variable WEB_ANALYTICS_TOKEN); empty, the page counts nothing
    required: false
    default: ""

runs:
  using: composite
  steps:
    # A release from before 0.21.0 has a site made for Vercel, with no
    # wrangler.jsonc: by hand, Put the site up again stops here for one,
    # rather than put up half a site.
    - name: Made for Cloudflare
      shell: bash
      run: |
        if [ ! -f site/wrangler.jsonc ]; then
          echo "::error::This release's site was made for Vercel, which no longer serves reha.stream. Put the site up with a newer release."
          exit 1
        fi

    # For the build, and for the tests, which check the page against it.
    - name: Which version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: echo "VITE_SITE_VERSION=$VERSION" >> "$GITHUB_ENV"

    # For the build, which puts it into the page's counter, and for the
    # tests, which check the counter carries it on reha.stream
    # (site/e2e/count.spec.ts). Cloudflare's tokens are letters and digits;
    # anything else would not be one, and could not go into $GITHUB_ENV safely.
    - name: Counter's token
      if: inputs.analytics-token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.analytics-token }}
      run: |
        if ! [[ "$TOKEN" =~ ^[A-Za-z0-9]+$ ]]; then
          echo "::error::WEB_ANALYTICS_TOKEN should be letters and digits only, as Cloudflare gives it."
          exit 1
        fi
        echo "VITE_WEB_ANALYTICS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

    - uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: npm
        cache-dependency-path: |
          ui/package-lock.json
          site/package-lock.json

    # The site draws with the interface's components and its React, so the
    # interface's packages come first.
    - name: Install
      shell: bash
      run: |
        npm ci --prefix ui
        npm ci --prefix site

    - name: Vitest
      shell: bash
      working-directory: site
      run: npm test

    - name: Build
      shell: bash
      working-directory: site
      run: npm run build

    # The app in the link picture draws in the computer's own font, which
    # Linux does not have: Inter stands in for it, as when the picture was
    # chosen (site/scripts/og-fonts.conf). Its files are in
    # site/scripts/fonts/, the four weights the app draws in, given to this
    # user's fonts rather than the system's: there is no apt or root here.
    # The tests after it see the same fonts.
    - name: Fonts for the link picture
      shell: bash
      run: |
        mkdir -p "$HOME/.local/share/fonts" "$HOME/.config/fontconfig"
        cp site/scripts/fonts/*.otf "$HOME/.local/share/fonts/"
        cp site/scripts/og-fonts.conf "$HOME/.config/fontconfig/fonts.conf"
        fc-match -f '%{family}\n' -- -apple-system | grep -q '^Inter' ||
          { echo "::error::The link picture would not be in Inter."; exit 1; }

    # og.png, the picture a chat shows for a link to the site: og.html,
    # photographed from this build (see site/scripts/og.mjs).
    - name: Draw the link picture
      shell: bash
      working-directory: site
      run: npm run og

    - name: Playwright
      shell: bash
      working-directory: site
      run: npm run test:e2e

    # What goes up to Cloudflare: the build's files (with _redirects and
    # _headers among them), wrangler.jsonc, which says what to do with
    # them, and the version of wrangler in site/package-lock.json, for the
    # jobs that put it up, which have no node_modules. Written with Node,
    # since Playwright's image has no jq.
    - name: Lay out the build for Cloudflare
      shell: bash
      run: |
        mkdir -p site/upload
        cp -R site/dist site/upload/dist
        cp site/wrangler.jsonc site/upload/
        node -e '
        const lock = require("./site/package-lock.json")
        const v = lock.packages["node_modules/wrangler"]?.version ?? ""
        if (!/^\d+\.\d+\.\d+$/.test(v)) { console.log("::error::No version of wrangler in site/package-lock.json."); process.exit(1) }
        require("fs").writeFileSync("site/upload/wrangler-version", v + "\n")
        '

    - uses: actions/upload-artifact@v7
      with:
        name: site
        path: site/upload/
        if-no-files-found: error
