# The website, reha.stream: site/ in this repository.
#
# A pull request that could change it builds it and runs its tests, so an
# interface change that breaks the page shows up before a release, not on
# the day of one. The site is deployed only when a release is out: the
# Release workflow calls this once it has attached the zips, so the page's
# download links work from the moment it is up and it shows the version
# people get.
#
# Vercel never builds anything itself: the project there has no Git
# connection, and this uploads the build it made (vercel deploy --prebuilt).
# It needs three repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID.

name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "ui/**"
      - "CHANGELOG.md"
      - ".github/workflows/site.yml"
  # From release.yml, on the release's own commit, after its zips are up.
  workflow_call:
    inputs:
      tag:
        description: The release's tag
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
  # By hand: deploy the latest release again, for the first deploy and when
  # setting up the domain.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a pull request's newer push replaces its older run.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # The release the site is for, and its tag for the page: the one
      # release.yml says, or by hand the latest one. By hand, the site is
      # built as it was at that release when the release has one (0.9.0 and
      # earlier do not), and otherwise as on the branch this was run from.
      - name: Which release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            if git cat-file -e "refs/tags/$tag:site/package.json" 2>/dev/null; then
              git checkout --quiet "refs/tags/$tag"
            fi
          fi
          echo "The site is for $tag, built from $(git rev-parse --short HEAD)."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            site/package-lock.json

      # The site draws with the interface's components and its React, so the
      # interface's packages come first.
      - name: Install
        run: |
          npm ci --prefix ui
          npm ci --prefix site

      - name: Vitest
        working-directory: site
        run: npm test

      # In a pull request the version is the newest one in CHANGELOG.md.
      - name: Build
        working-directory: site
        env:
          VITE_SITE_VERSION: ${{ steps.release.outputs.tag }}
        run: npm run build

      - name: Install the browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: site
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site/dist/
          if-no-files-found: error

  deploy:
    name: deploy
    needs: site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://reha.stream
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: dist

      # Vercel's Build Output API: the files as they are, served as they are.
      - name: Lay out the build for Vercel
        run: |
          mkdir -p .vercel/output/static
          cp -R dist/. .vercel/output/static/
          echo '{"version": 3}' > .vercel/output/config.json

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TAG: ${{ needs.site.outputs.tag }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Deploying needs the repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID."
            exit 1
          fi
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Deployed $TAG to $url"
          echo "The site for $TAG is at $url" >> "$GITHUB_STEP_SUMMARY"
