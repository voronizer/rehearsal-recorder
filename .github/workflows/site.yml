# The website, reha.stream: its checks on a pull request, and putting it up.
#
# One of five workflows, one for each part: Reha, Interface, Site, Service
# and Bridge.
#
# It goes up by itself:
#   - after a merge into main that changes site/, its build action
#     (.github/actions/site) or this file;
#   - after every release of РЭХА, once both zips are attached: reha.yml's
#     job `latest` starts this on main;
#   - by hand: Actions -> Site -> Run workflow puts up main's site. On another
#     branch it builds and tests, and puts nothing up.
# Not after a merge that changes only ui/ or CHANGELOG.md: nearly every
# merge does, and each would put the site up with an interface ahead of the
# release people download. The next release puts them up. In a fork
# nothing goes up, since reha.stream is this repository's, and nothing runs
# but a pull request's checks: a band that keeps a fork for its own band
# service has no use for the site's tests after each Sync fork.
#
# Every build asks GitHub which release is the latest, and takes the
# version and the news line from it (CHANGELOG.md). A block in site/content/
# whose heading ends in {from 0.22.0} waits for that version: a build for an
# older release leaves it out (site/src/content/markdown.ts).
#
# On a pull request that changes site/, ui/ (the site draws with the
# interface's components), CHANGELOG.md, the build action or this file:
#   site                  the site as it would go up after the merge,
#                         built and tested
#   site · after release  the same with every block in, when one waits for
#                         a version newer than the latest release
# Nothing from a pull request goes to Cloudflare (Alex, 2026-11-03): to see
# the site before a merge, build it on a computer (CONTRIBUTING.md).

name: Site

on:
  pull_request:
    paths:
      - site/**
      - ui/**
      - CHANGELOG.md
      - .github/actions/site/**
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - .github/actions/site/**
      - .github/workflows/site.yml
  workflow_dispatch:

# Reading the repository is all these need, bar the deploys, which read
# their own secrets. Said here because the default token can write, and a
# pull request from a fork runs this workflow.
permissions:
  contents: read

# A pull request's newer push replaces its older run. On main the runs go
# one after another, each to its end, so an older run never puts the site
# up after a newer one; of those waiting, only the newest is kept, and it
# has everything the others had.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The latest release, which Playwright the site has (the site's jobs run
  # in Playwright's image for that version, and a job's image has to be
  # known before the job starts), and whether a block waits for a newer
  # version. In a fork, only on a pull request; every job after this one
  # waits for it.
  which:
    name: which release
    if: github.event_name == 'pull_request' || github.repository == 'voronizer/rehearsal-recorder'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      playwright: ${{ steps.release.outputs.playwright }}
      waiting: ${{ steps.release.outputs.waiting }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      # A repository with no release yet (a fork, say) has no latest: the
      # site then takes the newest version in CHANGELOG.md. Any other
      # trouble asking GitHub stops the run, rather than put the site up
      # for a version that may not be out yet.
      - name: Which release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
          v=$(jq -r '.packages["node_modules/@playwright/test"].version // empty' site/package-lock.json)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No version of @playwright/test in site/package-lock.json."
            exit 1
          fi
          waiting=$(node site/scripts/waiting.mjs "$tag")
          echo "The latest release is ${tag:-not there}; Playwright $v; a block waits: $waiting."
          { echo "tag=$tag"; echo "playwright=$v"; echo "waiting=$waiting"; } >> "$GITHUB_OUTPUT"

  # The site as it goes up: the latest release's version, the blocks that
  # wait for a newer one left out. On a pull request, what goes up after
  # the merge; before a deploy, what goes up. In Playwright's image, run as
  # the machine's user (1001), who owns the checkout.
  site:
    name: site
    needs: which
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.which.outputs.playwright }}-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # A site put up without the token counts nothing, and that would only
      # show weeks later as no visits at all.
      - name: Counter's token
        if: github.event_name != 'pull_request' && vars.WEB_ANALYTICS_TOKEN == ''
        run: echo "::warning::The repository variable WEB_ANALYTICS_TOKEN is not set, so reha.stream will count no visits."

      - uses: ./.github/actions/site
        with:
          version: ${{ needs.which.outputs.tag }}
          analytics-token: ${{ vars.WEB_ANALYTICS_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore

  # The site as it will be after the next release, every block in: on a
  # pull request where a block waits for a version newer than the latest
  # release, so that block is tested before it is merged.
  site-all:
    name: site · after release
    needs: which
    if: github.event_name == 'pull_request' && needs.which.outputs.waiting == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.which.outputs.playwright }}-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/site
        with:
          version: ${{ needs.which.outputs.tag }}
          analytics-token: ${{ vars.WEB_ANALYTICS_TOKEN }}
          all-blocks: "true"
          artifact: site-all

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-all-playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore

  # The one place anything goes to reha.stream: the Worker reha-stream on
  # the owner's Cloudflare account (site/wrangler.jsonc), made of the files
  # the site job laid out, from main only, and only in this repository: a
  # band's fork runs this workflow too, and reha.stream is not theirs.
  # Cloudflare serves them as they are; the short links /mac and /windows
  # and a year's cache for the build's hashed files are the build's
  # _redirects and _headers. The deploy keeps reha.stream on the Worker.
  # Cloudflare gives a name to a Worker only while no DNS record of its own
  # holds it: 0.21.0's first deploy stopped on the old record for Vercel,
  # which was deleted by hand.
  # www.reha.stream is not here: a redirect rule in Cloudflare sends it to
  # reha.stream.
  #
  # It needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
  # kept in the environment "production", which only main may use: no
  # other branch's workflow can read them. The site's token is its own,
  # with no rights to the band service's database and files. The page
  # counts visits with Cloudflare Web Analytics (see
  # site/src/page/analytics.ts). One deploy at a time, and none is cut
  # short.
  deploy:
    name: site · deploy
    needs: [which, site]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'voronizer/rehearsal-recorder'
    runs-on: ubuntu-latest
    concurrency:
      group: reha-stream
      cancel-in-progress: false
    environment:
      name: production
      url: https://reha.stream
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      # Wrangler and what it needs come from npm and run their own install
      # scripts, so they are put in here, before the step that holds the
      # Cloudflare token.
      - name: Install wrangler
        run: npm install --global --no-audit --no-fund "wrangler@$(cat site/wrangler-version)"

      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          TAG: ${{ needs.which.outputs.tag }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Deploying needs the secret CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID), in the environment production or the repository."
            exit 1
          fi
          wrangler deploy
          echo "Deployed the site for ${TAG:-the newest version in CHANGELOG.md} to https://reha.stream"
          echo "The site for ${TAG:-the newest version in CHANGELOG.md} is at https://reha.stream" >> "$GITHUB_STEP_SUMMARY"
