# The website, reha.stream: its checks on a pull request, and putting it up.
#
# One of five workflows, one for each part: Reha, Interface, Site, Service
# and Bridge.
#
# It goes up by itself:
#   - after a merge into main that changes site/, its build action
#     (.github/actions/site) or this file;
#   - after every release of РЭХА, once both zips are attached: reha.yml's
#     job `latest` starts this on main;
#   - by hand: Actions -> Site -> Run workflow puts up main's site. On another
#     branch it builds and tests, and puts nothing up.
# Not after a merge that changes only ui/ or CHANGELOG.md: nearly every
# merge does, and each would put the site up with an interface ahead of the
# release people download. The next release puts them up.
#
# Every build asks GitHub which release is the latest, and takes the
# version and the news line from it (CHANGELOG.md). A block in site/content/
# whose heading ends in {from 0.22.0} waits for that version: a build for an
# older release leaves it out (site/src/content/markdown.ts).
#
# On a pull request that changes site/, ui/ (the site draws with the
# interface's components), CHANGELOG.md, the build action or this file:
#   site                  the site as it would go up after the merge,
#                         built and tested
#   site · after release  the same with every block in, when one waits for
#                         a version newer than the latest release
#   site · preview        that build on Cloudflare at an address of its own,
#                         only when site/, the build action or this file
#                         changes (Alex, 2026-10-11)

name: Site

on:
  pull_request:
    paths:
      - site/**
      - ui/**
      - CHANGELOG.md
      - .github/actions/site/**
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - .github/actions/site/**
      - .github/workflows/site.yml
  workflow_dispatch:

# Reading the repository is all these need, bar the deploys, which read
# their own secrets. Said here because the default token can write, and a
# pull request from a fork runs this workflow.
permissions:
  contents: read

# A pull request's newer push replaces its older run; anything else runs to
# its end.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The latest release, which Playwright the site has (the site's jobs run
  # in Playwright's image for that version, and a job's image has to be
  # known before the job starts), whether a block waits for a newer
  # version, and whether a pull request gets a preview.
  which:
    name: which release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      playwright: ${{ steps.release.outputs.playwright }}
      waiting: ${{ steps.release.outputs.waiting }}
      preview: ${{ steps.release.outputs.preview }}
    steps:
      # Two commits: on a pull request, the merge and main under it, so the
      # pull request's own changes are the difference between them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      # A repository with no release yet (a fork, say) has no latest: the
      # site then takes the newest version in CHANGELOG.md.
      - name: Which release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          v=$(jq -r '.packages["node_modules/@playwright/test"].version // empty' site/package-lock.json)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No version of @playwright/test in site/package-lock.json."
            exit 1
          fi
          waiting=$(node site/scripts/waiting.mjs "$tag")
          preview=false
          if [ "$EVENT" = pull_request ] &&
            git diff --name-only HEAD^1 HEAD | grep -qE '^(site/|\.github/actions/site/|\.github/workflows/site\.yml$)'; then
            preview=true
          fi
          echo "The latest release is ${tag:-not there}; Playwright $v; a block waits: $waiting; preview: $preview."
          { echo "tag=$tag"; echo "playwright=$v"; echo "waiting=$waiting"; echo "preview=$preview"; } >> "$GITHUB_OUTPUT"

  # The site as it goes up: the latest release's version, the blocks that
  # wait for a newer one left out. On a pull request, what goes up after
  # the merge; before a deploy, what goes up. In Playwright's image, run as
  # the machine's user (1001), who owns the checkout.
  site:
    name: site
    needs: which
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.which.outputs.playwright }}-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # A site put up without the token counts nothing, and that would only
      # show weeks later as no visits at all.
      - name: Counter's token
        if: github.event_name != 'pull_request' && vars.WEB_ANALYTICS_TOKEN == ''
        run: echo "::warning::The repository variable WEB_ANALYTICS_TOKEN is not set, so reha.stream will count no visits."

      - uses: ./.github/actions/site
        with:
          version: ${{ needs.which.outputs.tag }}
          analytics-token: ${{ vars.WEB_ANALYTICS_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore

  # The site as it will be after the next release, every block in: on a
  # pull request where a block waits for a version newer than the latest
  # release, so that block is tested before it is merged.
  site-all:
    name: site · after release
    needs: which
    if: github.event_name == 'pull_request' && needs.which.outputs.waiting == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.which.outputs.playwright }}-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/site
        with:
          version: ${{ needs.which.outputs.tag }}
          analytics-token: ${{ vars.WEB_ANALYTICS_TOKEN }}
          all-blocks: "true"
          artifact: site-all

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-all-playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore

  # A pull request's build as a preview on Cloudflare, never reha.stream:
  # the Worker reha-stream-preview (the environment "preview" in
  # site/wrangler.jsonc), which has no address of its own. Each pull request
  # gets a version of it at an address of its own,
  # pr-<number>-reha-stream-preview.<the account's subdomain>.workers.dev,
  # open to anyone with the link; the pull request shows it as "View
  # deployment". It is the site after the next release: site · after
  # release's build when a block waits, site's otherwise. Every wrangler
  # command here says --env preview, so nothing in a pull request reaches
  # the site's own Worker. The first deploy makes the preview Worker and
  # turns its version addresses on; later ones only make it the pull
  # request's build, which nobody sees there.
  #
  # Only a pull request that changes the site itself gets one (Alex,
  # 2026-10-11). Secrets reach a pull request only from a branch of this
  # repository, so one from a fork or from Dependabot is built and tested
  # and gets no preview. It needs the repository secrets
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, as the deploy does.
  preview:
    name: site · preview
    needs: [which, site, site-all]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      needs.which.outputs.preview == 'true' &&
      needs.site.result == 'success' &&
      (needs.site-all.result == 'success' || needs.site-all.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.which.outputs.waiting == 'true' && 'site-all' || 'site' }}
          path: site

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      # Wrangler and what it needs come from npm and run their own
      # install scripts, so they are put in here, before any step that
      # holds the Cloudflare token.
      - name: Install wrangler
        run: npm install --global --no-audit --no-fund "wrangler@$(cat site/wrangler-version)"

      - name: Deploy
        id: deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PR: ${{ github.event.pull_request.number }}
        run: |
          wrangler deploy --env preview
          WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler.ndjson" \
            wrangler versions upload --env preview --preview-alias "pr-$PR"
          url=$(node -e '
          const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)
          const upload = lines.map((l) => JSON.parse(l)).find((e) => e.type === "version-upload")
          console.log(upload?.preview_alias_url ?? "")
          ' "$RUNNER_TEMP/wrangler.ndjson")
          if [ -z "$url" ]; then
            echo "::error::Cloudflare gave the preview no address. Check that the Cloudflare account has a workers.dev subdomain, and that Preview URLs are on for the Worker reha-stream-preview."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "This pull request's site is at $url" >> "$GITHUB_STEP_SUMMARY"

  # The one place anything goes to reha.stream: the Worker reha-stream on
  # the owner's Cloudflare account (site/wrangler.jsonc), made of the files
  # the site job laid out, from main only. Cloudflare serves them as they
  # are; the short links /mac and /windows and a year's cache for the
  # build's hashed files are the build's _redirects and _headers. The
  # deploy keeps reha.stream on the Worker. Cloudflare gives a name to a
  # Worker only while no DNS record of its own holds it: 0.21.0's first
  # deploy stopped on the old record for Vercel, which was deleted by hand.
  # www.reha.stream is not here: a redirect rule in Cloudflare sends it to
  # reha.stream.
  #
  # --env="" names the site's own Worker out loud; the environment
  # "preview" is pull requests'. It needs the repository secrets
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, the band service's too.
  # The page counts visits with Cloudflare Web Analytics (see
  # site/src/page/analytics.ts). One deploy at a time, and none is cut
  # short.
  deploy:
    name: site · deploy
    needs: [which, site]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: reha-stream
      cancel-in-progress: false
    environment:
      name: production
      url: https://reha.stream
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      # As in a pull request's preview: wrangler's own install scripts run
      # here, before the step that holds the Cloudflare token.
      - name: Install wrangler
        run: npm install --global --no-audit --no-fund "wrangler@$(cat site/wrangler-version)"

      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          TAG: ${{ needs.which.outputs.tag }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Deploying needs the repository secret CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID)."
            exit 1
          fi
          wrangler deploy --env=""
          echo "Deployed the site for ${TAG:-the newest version in CHANGELOG.md} to https://reha.stream"
          echo "The site for ${TAG:-the newest version in CHANGELOG.md} is at https://reha.stream" >> "$GITHUB_STEP_SUMMARY"
