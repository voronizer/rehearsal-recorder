# The website, reha.stream: site/ in this repository.
#
# A pull request that could change it builds it and runs its tests, so an
# interface change that breaks the page shows up before a release, not on
# the day of one. A pull request from a branch here also puts its build on
# Vercel as a preview, to look at before merging. reha.stream itself changes
# only when a release is out: the Release workflow calls this once it has
# attached the zips, so the page's download links work from the moment it is
# up and it shows the version people get.
#
# Vercel never builds anything itself: the project there has no Git
# connection, and this uploads the build it made (vercel deploy --prebuilt).
# It needs three repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID. What Vercel does with an address before serving a file
# (the short links /mac and /windows, a year's cache for the build's hashed
# files) is in site/vercel-config.json.
#
# The picture a chat shows for a link to the site, og.png, is drawn here
# from the build (npm run og, after the build and before the tests), so it
# shows the app as the build has it.
#
# The page counts visits with Vercel's Web Analytics, and how fast it loads
# with Speed Insights, each switched on in the Vercel project (Analytics,
# Enable; Speed Insights, Enable). Only a deployment made after that serves
# their scripts, so when one is switched on later, run this by hand.

name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "ui/**"
      - "CHANGELOG.md"
      - ".github/workflows/site.yml"
  # From release.yml, on the release's own commit, after its zips are up.
  workflow_call:
    inputs:
      tag:
        description: The release's tag
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
  # By hand: deploy the latest release again, for the first deploy and when
  # setting up the domain.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a pull request's newer push replaces its older run.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # The release the site is for, and its tag for the page: the one
      # release.yml says, or by hand the latest one. By hand, the site is
      # built as it was at that release when the release has one (0.9.0 and
      # earlier do not), and otherwise as on the branch this was run from.
      - name: Which release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            if git cat-file -e "refs/tags/$tag:site/package.json" 2>/dev/null; then
              git checkout --quiet "refs/tags/$tag"
            fi
          fi
          echo "The site is for $tag, built from $(git rev-parse --short HEAD)."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # For the build, and for the tests, which check the page against it.
          echo "VITE_SITE_VERSION=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            site/package-lock.json

      # The site draws with the interface's components and its React, so the
      # interface's packages come first.
      - name: Install
        run: |
          npm ci --prefix ui
          npm ci --prefix site

      - name: Vitest
        working-directory: site
        run: npm test

      # In a pull request the version is the newest one in CHANGELOG.md.
      - name: Build
        working-directory: site
        run: npm run build

      - name: Install the browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      # The app in the link picture draws in the computer's own font, which
      # the runner does not have: Inter stands in for it, as when the
      # picture was chosen (site/scripts/og-fonts.conf). The browser's step
      # has just updated apt's lists. A stuck mirror fails it rather than
      # hold the job.
      - name: Fonts for the link picture
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends fonts-inter
          sudo cp site/scripts/og-fonts.conf /etc/fonts/conf.d/56-og-fonts.conf
          fc-match -f '%{family}\n' -- -apple-system | grep -q '^Inter' ||
            { echo "::error::The link picture would not be in Inter."; exit 1; }

      # og.png, the picture a chat shows for a link to the site: og.html,
      # photographed from this build (see site/scripts/og.mjs).
      - name: Draw the link picture
        working-directory: site
        run: npm run og

      - name: Playwright
        working-directory: site
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore

      # Vercel's Build Output API: the files as they are, served as they are,
      # with the site's routes from vercel-config.json. A release from before
      # that file, deployed again by hand, goes up without them.
      - name: Lay out the build for Vercel
        run: |
          mkdir -p site/vercel-output
          cp -R site/dist site/vercel-output/static
          if [ -f site/vercel-config.json ]; then
            cp site/vercel-config.json site/vercel-output/config.json
          else
            echo '{"version": 3}' > site/vercel-output/config.json
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/vercel-output/
          if-no-files-found: error

  deploy:
    name: deploy
    needs: site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://reha.stream
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: .vercel/output

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TAG: ${{ needs.site.outputs.tag }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Deploying needs the repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID."
            exit 1
          fi
          url=$(npx --yes vercel@62.4.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Deployed $TAG to $url"
          echo "The site for $TAG is at $url" >> "$GITHUB_STEP_SUMMARY"

  # A pull request's build on Vercel as a preview, never production: the
  # pull request shows it as "View deployment", and it opens after logging
  # in to Vercel, with Vercel's toolbar for comments on the page. Secrets
  # reach a pull request only from a branch of this repository, so one from
  # a fork or from Dependabot is built and tested and gets no preview.
  preview:
    name: preview
    needs: site
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: .vercel/output

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx --yes vercel@62.4.0 deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "This pull request's site is at $url" >> "$GITHUB_STEP_SUMMARY"
