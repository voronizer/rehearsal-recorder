# The interface, ui/: its checks on a pull request that changes it, or the
# app's icons it carries (packaging/icon.svg and icon-small.svg).
#
# One of five workflows, one for each part: Reha, Interface, Site, Service
# and Bridge. The interface goes out inside РЭХА, so nothing here puts
# anything up; a change to it also runs Site's and Service's checks, whose
# pages draw with it.

name: Interface

on:
  pull_request:
    paths:
      - ui/**
      - packaging/icon.svg
      - packaging/icon-small.svg
      - .github/workflows/interface.yml

permissions:
  contents: read

# A pull request's newer push replaces its older run.
concurrency:
  group: interface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which Playwright the interface has in its lock file. The jobs with a
  # browser run in Playwright's own image for that version
  # (mcr.microsoft.com/playwright:v<version>-noble, noble being Ubuntu
  # 24.04, as on the other machines), which has the browser and everything
  # it needs, and a job's image has to be known before the job starts. A
  # bump of @playwright/test (Dependabot's, say) takes the image along in
  # the same pull request. Playwright puts out the image with each release;
  # one not out yet stops the job at its start ("manifest unknown" under
  # Initialize containers), and running it again later gets it.
  playwright:
    name: which playwright
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Playwright's version
        id: version
        run: |
          v=$(jq -r '.packages["node_modules/@playwright/test"].version // empty' ui/package-lock.json)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No version of @playwright/test in ui/package-lock.json."
            exit 1
          fi
          echo "Playwright $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # The interface: the Vitest files beside the code, and Playwright against
  # the built bundle, headless against a faked Python side. Nothing in them
  # depends on the system underneath, so they run once, on Linux, the
  # quickest machine to get, inside Playwright's image (see `which playwright`
  # above). As Playwright's own example has it, the job runs as the
  # machine's user (1001), who owns the checkout, not as the image's root.
  #
  # The browser tests are nearly all of its time, and they keep all four of
  # a machine's cores busy, so more of them at once on one machine gains
  # nothing. They run in three parts on three machines at once instead,
  # split by Playwright's own --shard: interface · 1/3, 2/3 and 3/3. On
  # 2026-10-17 that took the whole check from 9 minutes to under 4 (two
  # machines: 4.6); a fourth would gain little. The steps are written once,
  # under &interface, and the other two jobs take them as they are
  # (*interface); PART tells the three apart. What needs no browser runs in
  # the first part alone.
  #
  # Three jobs and not a matrix, as with the app's (reha.yml), so that a
  # skipped one keeps its name.
  interface-1:
    name: interface · 1/3
    needs: playwright
    runs-on: ubuntu-latest
    container: &interface-image
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001
    timeout-minutes: 30
    env:
      PART: 1
    defaults:
      run:
        working-directory: ui
    steps: &interface
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      # The design rules, read off the source: a text size off the scale, a
      # colour round the theme, a hand-made button or dialog, Radix outside
      # components/ui. Screens not yet redone are on ui/design-check.allow.json,
      # which each screen's PR shortens. Node only, so it comes first.
      - name: Design check
        if: env.PART == '1'
        run: npm run design-check

      # tsc -b first, so a type error fails here rather than as a test.
      - name: Build
        run: npm run build

      - name: Vitest
        if: env.PART == '1'
        run: npm test

      # The showcase: every component's stories, built. A story that imports
      # something that is gone, or has a syntax error, fails here.
      - name: Showcase
        if: env.PART == '1'
        run: npm run build-storybook

      - name: Playwright
        run: npm run test:e2e -- --shard="$PART/3"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ env.PART }}
          path: ui/playwright-report/
          if-no-files-found: ignore

  interface-2:
    name: interface · 2/3
    needs: playwright
    runs-on: ubuntu-latest
    container: *interface-image
    timeout-minutes: 30
    env:
      PART: 2
    defaults:
      run:
        working-directory: ui
    steps: *interface

  interface-3:
    name: interface · 3/3
    needs: playwright
    runs-on: ubuntu-latest
    container: *interface-image
    timeout-minutes: 30
    env:
      PART: 3
    defaults:
      run:
        working-directory: ui
    steps: *interface
