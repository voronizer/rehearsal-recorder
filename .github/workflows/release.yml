# Builds the apps people download, when a release is published on GitHub.
#
# How to cut a release:
#   1. Update CHANGELOG.md.
#   2. On GitHub: Releases -> Draft a new release -> new tag (v0.1.0) ->
#      Publish.
#   3. This runs. When it finishes the zips are attached to that release.
#
# Nothing is built from a Linux machine and hoped for: a Mac build is made on
# a Mac and a Windows build on Windows, because that is the only way either
# can exist. Each one runs the test suites first and then runs --selftest on
# the app it just produced — a build that cannot answer for itself is never
# attached to a release.

name: Release

on:
  release:
    types: [published]
  # For rehearsing the workflow without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            built: dist/RehearsalRecorder.app
            selftest: dist/RehearsalRecorder.app/Contents/MacOS/RehearsalRecorder
          - os: windows-latest
            label: windows
            built: dist/RehearsalRecorder
            selftest: dist/RehearsalRecorder/RehearsalRecorder.exe

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller playwright
          playwright install chromium

      # Same suites as tests.yml, but here on the system being shipped —
      # which is the only place some of the platform branches are real.
      - name: Run every suite
        run: python tests/run_all.py

      - name: Package
        run: pyinstaller packaging/rehearsal-recorder.spec --noconfirm

      # The question no source test can answer: did every native library
      # actually make it into the bundle?
      - name: Does the build have everything
        run: ${{ matrix.selftest }} --selftest

      # Windows runners don't have `zip` on PATH (even under the bash shell),
      # so that leg uses PowerShell's Compress-Archive instead.
      - name: Zip it
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          zip -qry ../RehearsalRecorder-${{ matrix.label }}.zip RehearsalRecorder.app
          cd ..
          ls -lh RehearsalRecorder-${{ matrix.label }}.zip

      - name: Zip it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/RehearsalRecorder -DestinationPath RehearsalRecorder-${{ matrix.label }}.zip
          Get-Item RehearsalRecorder-${{ matrix.label }}.zip | Format-List Name, Length

      # Kept whether or not there is a release to attach to, so
      # workflow_dispatch runs produce something to download too.
      - uses: actions/upload-artifact@v7
        with:
          name: RehearsalRecorder-${{ matrix.label }}
          path: RehearsalRecorder-${{ matrix.label }}.zip
          if-no-files-found: error

      - name: Attach it to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: RehearsalRecorder-${{ matrix.label }}.zip
