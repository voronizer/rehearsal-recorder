# The test suites, on every push and every pull request.
#
# These do not need a sound card, a screen or a microphone: PortAudio is
# stubbed where the audio is checked, and the interface runs headless against
# a mocked Python bridge. So they run on Linux, quickly, and say something
# real about every change.
#
# Building the actual apps is release.yml — that needs a Mac and a Windows
# machine, and only matters when there is something to hand people.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The interface suite drives the built bundle, not the sources.
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      # PortAudio is not bundled in the Linux wheel, and the suites stub
      # sounddevice anyway — but importing it has to at least work.
      - name: Install PortAudio
        run: sudo apt-get install -y libportaudio2

      - name: Run every suite
        run: python tests/run_all.py

      # The screenshots the interface suite takes along the way. Worth having
      # when something fails and the message alone is not enough.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
