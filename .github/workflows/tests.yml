# The test suites, on every push and every pull request.
#
# On the two systems the app is actually used on. These suites need no sound
# card, screen or microphone — PortAudio is stubbed where the audio is
# checked, and the interface runs headless against a mocked Python bridge —
# so for a long time they ran on Linux, on the reasoning that what they test
# is the same everywhere and Linux is the quickest runner to get.
#
# It is not the same everywhere. A Mac's filesystem does not tell "Other"
# from "other" and Linux's does, so a check written against exactly that
# skipped itself on every push and reached main broken. Windows differs
# again: a file open for playing cannot be moved, cp1252 has no Cyrillic,
# and paths compare without case. Those branches are most of what breaks,
# and a runner that never takes them has nothing to say about them.
#
# Building the actual apps is release.yml — that needs the same two machines
# and only matters when there is something to hand people.
#
# The interface is the exception. Its tests run in a browser against a faked
# Python side, and nothing in them depends on the system underneath, so they
# run once, on Linux, in a job of their own beside the other two: the
# `interface` job below.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reading the repository is all these need — they build it and run it, and
# write nothing back. Said here because the default token can write, and a
# pull request from a fork runs this workflow.
permissions:
  contents: read

jobs:
  test:
    strategy:
      # One platform failing is a result about that platform, not a reason
      # to stop asking about the other.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history, because the version comes from the release
      # tag — a shallow clone has no tags and would build a 0.0.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # --selftest below checks that the app finds its built interface.
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # `pip install -e .` rather than requirements.txt on purpose: it reads
      # the same list through pyproject.toml, and it means every push also
      # checks that the package metadata still installs.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run every suite
        run: python tests/run_all.py

      # The suites keep the MIDI library out so they never touch a port; this
      # is the one place it runs for real. On macOS it makes a virtual port,
      # plays 100 notes into it and pulls it; on Windows it lists what the
      # system has. See the top of the script.
      - name: The MIDI library on this machine
        run: python tests/midi_live.py

      # The entry point the docs tell people to use. Cheap, and it catches a
      # package that imports from a clone but not once installed.
      - name: Does it start
        run: python -m rehearsal_recorder --selftest

  # The interface: the Vitest files beside the code, and Playwright against
  # the built bundle. Linux, because what they test is the same everywhere,
  # and it is the quickest machine to get.
  interface:
    name: interface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      # tsc -b first, so a type error fails here rather than as a test.
      - name: Build
        run: npm run build

      - name: Vitest
        run: npm test

      # The showcase: every component's stories, built. A story that imports
      # something that is gone, or has a syntax error, fails here. Node only,
      # so it runs before the browser install and does not depend on apt.
      - name: Showcase
        run: npm run build-storybook

      # --with-deps: on Linux the browser needs system libraries and fonts.
      # The apt step it runs sometimes hangs on a stuck mirror, so it gets
      # a limit of its own.
      - name: Install the browser
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          if-no-files-found: ignore
