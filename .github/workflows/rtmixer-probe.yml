# A probe for the skips fix, on this branch only: never merged. Plays a take
# through real sound drivers on Windows (ASIO, through FlexASIO) and macOS
# (Core Audio) the way the app plays now and through rtmixer, under load,
# records what came out through a loopback device, and freezes rtmixer with
# PyInstaller to see it play from a bundle. See .github/rtmixer-probe/.

name: rtmixer probe

on:
  push:
    branches: [claude/project-thread-09lvgc]
    paths:
      - .github/rtmixer-probe/**
      - .github/workflows/rtmixer-probe.yml

permissions:
  contents: read

concurrency:
  group: rtmixer-probe-${{ github.sha }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e . rtmixer==0.1.7 pyinstaller

      # A virtual cable: what is played into "CABLE Input" comes out of
      # "CABLE Output", where a second process records it.
      - uses: LABSN/sound-ci-helpers@v1

      - name: FlexASIO, an ASIO driver over Windows audio
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recording is refused (E_ACCESSDENIED) until desktop apps may use
          # the microphone.
          $mic = "SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
          reg add "HKLM\$mic" /v Value /t REG_SZ /d Allow /f
          reg add "HKCU\$mic" /v Value /t REG_SZ /d Allow /f
          reg add "HKCU\$mic\NonPackaged" /v Value /t REG_SZ /d Allow /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy" /v LetAppsAccessMicrophone /t REG_DWORD /d 1 /f
          Set-Service Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue
          gh release download --repo dechamps/FlexASIO --pattern "FlexASIO-*.exe" --dir $env:RUNNER_TEMP
          $exe = Get-ChildItem $env:RUNNER_TEMP -Filter "FlexASIO-*.exe" | Select-Object -First 1
          Write-Host "Installing $($exe.Name)"
          Start-Process -Wait -FilePath $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-"
          # An empty FlexASIO.log in the profile turns its log on.
          New-Item -ItemType File -Path "$env:USERPROFILE\FlexASIO.log" -Force | Out-Null

      - name: Devices
        shell: bash
        run: python -c "import rehearsal_recorder, sounddevice as sd; print(sd.query_hostapis()); print(sd.query_devices())"

      - name: Play and record, ASIO buffer 1024 then 256
        if: false  # run 12 has it
        shell: bash
        working-directory: .github/rtmixer-probe
        run: |
          for buf in 1024; do
            printf 'backend = "Windows WASAPI"\nbufferSizeSamples = %s\n\n[input]\ndevice = ""\n' "$buf" > "$USERPROFILE/FlexASIO.toml"
            # Run 12: the sound mixed in a process of its own ("rtp"), the
            # load stays in this one.
            python probe.py --out-device FlexASIO --out-api ASIO --loop-device "CABLE Output" --loop-api "Windows DirectSound" \
              --cases rtp:heavy,rtq:heavy,rtp:heavy,rtp:heavy,rtp:applike \
              --label "asio$buf" --results results.jsonl || echo "probe asio$buf failed"
          done

      - name: Record under load, ASIO buffer 1024 then 256
        if: false  # done in run 5
        shell: bash
        working-directory: .github/rtmixer-probe
        run: |
          for buf in 1024 256; do
            printf 'backend = "Windows WASAPI"\nbufferSizeSamples = %s\n' "$buf" > "$USERPROFILE/FlexASIO.toml"
            python rec_probe.py --in-device FlexASIO --in-api ASIO --tone-device "VB-Audio Virtual Cable" --tone-api "Windows DirectSound" \
              --label "asio$buf" --results results.jsonl || echo "rec probe asio$buf failed"
          done

      # Run 13: a take recorded in the second process, with the load in this
      # one; where the card is and a level come back through shared memory.
      - name: Record in a second process
        shell: bash
        working-directory: .github/rtmixer-probe
        run: |
          printf 'backend = "Windows WASAPI"\nbufferSizeSamples = 1024\n' > "$USERPROFILE/FlexASIO.toml"
          for i in 1 2; do python proc_duplex.py "pd_asio_$i.wav" 30 FlexASIO ASIO || echo "duplex $i failed"; done

      - name: Frozen, also from a second process
        if: false  # run 12 has it
        shell: bash
        working-directory: .github/rtmixer-probe
        run: |
          printf 'backend = "Windows WASAPI"\nbufferSizeSamples = 1024\n\n[input]\ndevice = ""\n' > "$USERPROFILE/FlexASIO.toml"
          pyinstaller --noconfirm --onedir --log-level WARN --collect-data _sounddevice_data --collect-data sounddevice freeze_check.py
          dist/freeze_check/freeze_check.exe FlexASIO ASIO

      - name: Results
        if: always()
        shell: bash
        working-directory: .github/rtmixer-probe
        run: |
          cat results.jsonl >> "$GITHUB_STEP_SUMMARY" || true
          grep -iE "error|fail|unable|cannot" "$USERPROFILE/FlexASIO.log" | tail -40 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-windows
          path: |
            .github/rtmixer-probe/results.jsonl
            .github/rtmixer-probe/*.wav
            .github/rtmixer-probe/rec_*/*.wav
          if-no-files-found: warn

  macos:
    # macos-latest and macos-15 each sat 15 minutes unpicked and were
    # cancelled (runs 4 and 6); the app's own CI ran on macos-latest at 16:11.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . rtmixer==0.1.7 pyinstaller

      # A loopback device: what is played into it can be recorded from it.
      - name: BlackHole
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 5

      - name: Devices
        run: python -c "import rehearsal_recorder, sounddevice as sd; print(sd.query_hostapis()); print(sd.query_devices())"

      # Runs 10 and 11: under heavy load here Python mixes too slowly, and
      # neither a bigger reserve nor bigger blocks fix it. Run 12: the sound
      # mixed in a process of its own ("rtp"), the load stays in this one.
      - name: Sound in its own process
        if: false  # run 12 has it
        working-directory: .github/rtmixer-probe
        run: |
          python probe.py --out-device BlackHole --out-api "Core Audio" --loop-device BlackHole --loop-api "Core Audio" \
            --label coreaudio --reserve 1 --results results.jsonl \
            --cases rtp:heavy,rtq:heavy,rtp:heavy,rtp:heavy,rtp:applike || echo "probe failed"

      - name: Record under load
        if: false  # done in run 9
        working-directory: .github/rtmixer-probe
        run: |
          python rec_probe.py --in-device BlackHole --in-api "Core Audio" --tone-device BlackHole --tone-api "Core Audio" \
            --label coreaudio --results results.jsonl || echo "rec probe failed"

      # Run 13: a take recorded in the second process, with the load in this
      # one; where the card is and a level come back through shared memory.
      - name: Record in a second process
        working-directory: .github/rtmixer-probe
        run: |
          for i in 1 2; do python proc_duplex.py "pd_mac_$i.wav" 30 BlackHole "Core Audio" || echo "duplex $i failed"; done

      - name: Frozen, also from a second process
        if: false  # run 12 has it
        working-directory: .github/rtmixer-probe
        run: |
          pyinstaller --noconfirm --onedir --log-level WARN --collect-data _sounddevice_data --collect-data sounddevice freeze_check.py
          dist/freeze_check/freeze_check BlackHole "Core Audio"

      - name: Results
        if: always()
        working-directory: .github/rtmixer-probe
        run: cat results.jsonl >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-macos
          path: |
            .github/rtmixer-probe/results.jsonl
            .github/rtmixer-probe/*.wav
            .github/rtmixer-probe/rec_*/*.wav
          if-no-files-found: warn
