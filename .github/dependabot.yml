# Weekly pull requests when a dependency moves.
#
# Grouped on purpose: one PR a week per ecosystem rather than one per
# package, because every one of them costs a full CI run on three machines.
# Major versions stay ungrouped — those are the ones worth reading.

version: 2
updates:
  # The actions in .github/workflows. These are what actually go stale
  # here: GitHub retires a Node runtime and every run starts warning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      interface:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Quiet while requirements.txt names packages without versions — there is
  # no constraint to raise. It starts working the day anything is pinned.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
