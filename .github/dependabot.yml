# Weekly pull requests when a dependency moves.
#
# Grouped on purpose: one PR a week per ecosystem rather than one per
# package, because every one of them costs a full CI run on three machines.
# Major versions stay ungrouped — those are the ones worth reading.

version: 2
updates:
  # The actions in .github/workflows and in the two shared steps under
  # .github/actions. These are what actually go stale here: GitHub retires
  # a Node runtime and every run starts warning.
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      interface:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The band service and the website keep lockfiles of their own. Their
  # pull requests run only their own checks, and the website's gets no
  # preview on Vercel (checks.yml).
  - package-ecosystem: "npm"
    directory: "/service"
    schedule:
      interval: "weekly"
    groups:
      service:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      site:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Quiet while requirements.txt names packages without versions — there is
  # no constraint to raise. It starts working the day anything is pinned.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
